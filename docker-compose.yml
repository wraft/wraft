services:
  frontend:
    image: quay.io/wraft/wraft-frontend:latest
    environment:
      NEXT_PUBLIC_API_HOST: http://localhost:4000
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:4000
    ports:
      - "3200:3000"

  backend:
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        SELF_HOSTED: ${SELF_HOSTED}
    environment:
      CLOAK_KEY: ${CLOAK_KEY}
      DATABASE_URL: postgres://${DEV_DB_USERNAME}:${DEV_DB_PASSWORD}@db:5433/${DEV_DB_NAME}?ssl=false
      GUARDIAN_KEY: ${GUARDIAN_KEY}
      S3_HOST: rustfs
      S3_PORT: 9000
      S3_BUCKET: ${S3_BUCKET}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-wraft-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_URL: http://127.0.0.1:9000
      SYSTEM_BACKUP_ENABLED: ${SYSTEM_BACKUP_ENABLED:-false}
      MIX_ENV: dev
      PADDLE_API_KEY: ${PADDLE_API_KEY}
      PADDLE_BASE_URL: ${PADDLE_BASE_URL}
      PADDLE_WEBHOOK_SECRET_KEY: ${PADDLE_WEBHOOK_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SELF_HOSTED: ${SELF_HOSTED}
      SENTRY_DSN: ${SENTRY_DSN}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_HOST: typesense
      XELATEX_PATH: ${XELATEX_PATH}
    ports:
      - 4000:4000
    depends_on:
      db:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
      typesense:
        condition: service_started
    restart: always

  db:
    # PG18 official image stores data in a major-version subdir and expects the
    # volume mounted at /var/lib/postgresql (not /var/lib/postgresql/data).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DEV_DB_USERNAME}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: ${DEV_DB_NAME}
      PGPORT: 5433
    restart: always
    ports:
      - 5433:5433
    volumes:
      - db:/var/lib/postgresql

  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfsdata:/data
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  createbucket:
    image: rustfs/rc:v0.1.36
    environment:
      S3_URL: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-wraft-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./scripts/rustfs:/init:ro
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]

  typesense:
    image: typesense/typesense:27.1
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    volumes:
      - typesense_data:/data
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY}

volumes:
  db:
  rustfsdata:
  typesense_data:
